name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build version stamp
        run: node scripts/write-build-version.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Build
        run: npm run build
        env:
          # "/spelling-test" en un project site; vacío con dominio propio.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # GitHub Pages no tiene rewrites: las rutas de BrowserRouter caen en 404.html.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_primary.outcome == 'success' && steps.deploy_primary.outputs.page_url || steps.deploy_fallback.outputs.page_url }}
    steps:
      # La API de Pages a veces responde "Deployment failed, try again later" sin más detalle.
      - id: deploy_primary
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Esperar y reintentar despliegue (fallo transitorio de Pages)
        if: steps.deploy_primary.outcome == 'failure'
        run: sleep 60

      - id: deploy_fallback
        if: steps.deploy_primary.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Comprobar que el despliegue terminó bien
        if: always()
        run: |
          if [ "${{ steps.deploy_primary.outcome }}" = "success" ]; then
            exit 0
          fi
          if [ "${{ steps.deploy_fallback.outcome }}" = "success" ]; then
            exit 0
          fi
          echo "::error::El despliegue a GitHub Pages falló (intento 1 y 2)." && exit 1
